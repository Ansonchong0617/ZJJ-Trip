<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>湖南双城记-旅行手账</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { background-color: #ecfdf5; color: #047857; }
        .donut-chart {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 0.3s ease;
        }
        .donut-inner {
            width: 110px;
            height: 110px;
            background-color: #115e59; /* teal-800 */
            border: 4px solid #0f766e; /* teal-700 */
            border-radius: 50%;
            z-index: 2;
        }
        /* 隐藏数字输入框的上下箭头 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-50 pb-20 text-gray-800">
    <!-- Header -->
    <div class="bg-emerald-600 text-white p-6 shadow-md rounded-b-3xl">
        <div class="flex justify-between items-start mb-2">
            <h1 class="text-2xl font-bold flex items-center">
                <i data-lucide="map" class="mr-2 w-6 h-6"></i> 湖南双城记
            </h1>
            <!-- 云端同步指示器 -->
            <div class="flex items-center bg-emerald-700/50 px-2 py-1 rounded-full text-[10px]" id="sync-badge">
                <i data-lucide="loader-2" class="w-3 h-3 mr-1 animate-spin" id="sync-icon"></i>
                <span id="sync-status">初始化中...</span>
            </div>
        </div>
        <p class="text-emerald-100 text-sm opacity-90">长沙 · 张家界 · 凤凰古城 (7天6夜)</p>
        <p class="text-emerald-100 text-sm opacity-90 mt-1 flex items-center">
            <i data-lucide="calendar" class="w-4 h-4 mr-1"></i> 2026.05.29 - 2026.06.04
        </p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex justify-center mt-[-20px] px-4 relative z-10">
        <div class="bg-white rounded-full shadow-lg p-1 flex w-full max-w-sm">
            <button onclick="window.switchTab('itinerary')" id="btn-itinerary" class="tab-active flex-1 flex items-center justify-center py-2 rounded-full text-sm font-medium transition-all">
                <i data-lucide="list" class="w-4 h-4 mr-1"></i> 行程线
            </button>
            <button onclick="window.switchTab('expenses')" id="btn-expenses" class="flex-1 flex items-center justify-center py-2 rounded-full text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">
                <i data-lucide="wallet" class="w-4 h-4 mr-1"></i> 费用统计
            </button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="p-4 mt-4 max-w-lg mx-auto">
        <!-- TAB 1: ITINERARY -->
        <div id="content-itinerary" class="space-y-6">
            <!-- Day Cards will be injected here by JS -->
        </div>

        <!-- TAB 2: EXPENSES -->
        <div id="content-expenses" class="hidden space-y-6">
            <!-- Total Summary Card -->
            <div class="bg-gradient-to-br from-emerald-600 to-teal-800 rounded-2xl p-6 text-white shadow-lg">
                <p class="text-emerald-100 text-sm mb-1 flex items-center">
                    <i data-lucide="pie-chart" class="w-4 h-4 mr-1"></i> 总预算及消费记录 (RM/CNY)
                </p>
                <h2 id="grand-total" class="text-4xl font-bold mb-6">0.00</h2>
                
                <!-- Donut Chart 可视化图表 -->
                <div class="flex justify-center mb-6">
                    <div id="main-chart" class="donut-chart shadow-inner" style="background: conic-gradient(#60A5FA 0% 0%, #FB923C 0% 0%, #C084FC 0% 0%, #FACC15 0% 0%, #F472B6 0% 100%);">
                        <div class="donut-inner flex flex-col items-center justify-center shadow-md">
                            <span class="text-xs text-emerald-200">累计总支出</span>
                            <span id="chart-center-total" class="text-lg font-bold text-white mt-1">¥0</span>
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-y-3 text-xs text-emerald-50 mt-2">
                    <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-blue-400 mr-2 shadow-sm"></div>大交通</div>
                    <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-orange-400 mr-2 shadow-sm"></div>门票玩乐</div>
                    <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-purple-400 mr-2 shadow-sm"></div>酒店住宿</div>
                    <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-yellow-400 mr-2 shadow-sm"></div>餐饮美食</div>
                    <div class="flex items-center"><div class="w-3 h-3 rounded-full bg-pink-400 mr-2 shadow-sm"></div>纪念品等</div>
                </div>
            </div>

            <!-- Expense Breakdown List -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">明细清单</h3>
                <div class="space-y-4" id="expense-breakdown">
                    <!-- Breakdown items injected via JS -->
                </div>
            </div>

            <!-- Important Notes -->
             <div class="bg-yellow-50 rounded-2xl border border-yellow-200 p-4">
                <h3 class="font-bold text-yellow-800 mb-2 flex items-center text-sm">
                    <i data-lucide="coffee" class="w-4 h-4 mr-2"></i> 行前提醒
                </h3>
                <ul class="text-xs text-yellow-700 space-y-2 pl-6 list-disc marker:text-yellow-400">
                    <li>多段高铁 (HSR) 行程时间可能会有变动，请在出发前再次通过 12306 或相关票务平台确认。</li>
                    <li>张家界森林公园及天门山为包车/套票模式，请提前联系 Klook 确认接送地点。</li>
                    <li>此总预算未包含旅途中的日常餐饮及个人购物消费。</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Data Definitions ---
        const itineraryData = [
            { date: "2026-05-29", day: "Day 0", loc: "吉隆坡 > 长沙", trans: "Flight: Batik Airline 20:10 - 01:00", transType: "plane", itin: "入住酒店 - 长沙（五一广场附近）", hotel: "凤栖梧桐假日酒店", remark: "", exp: { t: 3124.0, k: 0, h: 133.21 } },
            { date: "2026-05-30", day: "Day 1", loc: "长沙 > 张家界", trans: "HSR: ChangSha > ZJJWest (18:13-20:10)", transType: "train", itin: "橘子洲、岳麓山，岳麓山书院，湖南大学，岳麓山南路美食街(臭豆腐，笨萝卜)前往张家界。", hotel: "全季七十二奇楼酒店", remark: "HSR 时间可能会改", exp: { t: 349.0, k: 0, h: 562.0 } },
            { date: "2026-05-31", day: "Day 2", loc: "张家界森林公园", trans: "Klook 包车/门票包", transType: "navigation", itin: "深林公园标志门 - 百龙天梯 - 袁家界 - 天子山 - 天子索道下 - 十里画廊 (土家扣肉）", hotel: "全季七十二奇楼酒店", remark: "", exp: { t: 0, k: 1447.0, h: 0 } },
            { date: "2026-06-01", day: "Day 3", loc: "张家界天门山", trans: "Klook 包车/门票包", transType: "navigation", itin: "天门山 - 索道上 - 99弯通天大道 - 天门洞 - 穿山扶梯 - 鬼谷栈道 - 玻璃栈道 - 云梦星顶 - 索道下 - 夜游七十二奇楼 (胡师傅三下锅）", hotel: "全季七十二奇楼酒店", remark: "", exp: { t: 0, k: 108.0, h: 0 } },
            { date: "2026-06-02", day: "Day 4", loc: "张家界 > 凤凰古城", trans: "HSR: ZJJWest > Feng Huang (9:42-10:34)", transType: "train", itin: "上午前往凤凰，沈从文故居，熊希龄故居，南华侨，万寿宫，沱江泛舟，万名塔，雪桥，吊脚楼，南华门，虹桥风雨楼 (血粑鸭，酸汤鱼，苗乡菜豆腐，姜糖）", hotel: "凤凰古城虹桥亚朵见野酒店", remark: "HSR 时间可能会改", exp: { t: 198.0, k: 0, h: 213.0 } },
            { date: "2026-06-03", day: "Day 5", loc: "凤凰古城 > 长沙南", trans: "HSR: Feng Huang > Changsha Nan (10:26-12:43)", transType: "train", itin: "上午前往凤凰, 往长沙方向走， 五一广场商圈，黄兴路步行街，IFS 国金中心 ，东茅街茶馆。", hotel: "长沙酒店 (待定/未记录)", remark: "HSR 时间可能会改", exp: { t: 417.0, k: 0, h: 0 } },
            { date: "2026-06-04", day: "Day 6", loc: "长沙 > 吉隆坡", trans: "Flight: Batik Airline 02:00 - 06:00", transType: "plane", itin: "准备返程，结束愉快的旅途！", hotel: "", remark: "", exp: { t: 0, k: 0, h: 0 } }
        ];

        let dailyExtras = {};
        itineraryData.forEach((_, i) => dailyExtras[i] = { food: '', souvenir: '' });

        // --- Firebase Setup ---
        let app, auth, db, appId, currentUser;
        const syncStatusEl = document.getElementById('sync-status');
        const syncIconEl = document.getElementById('sync-icon');

        function updateSyncUI(state) {
            syncIconEl.className = 'w-3 h-3 mr-1'; // Reset
            if (state === 'loading') {
                syncStatusEl.innerText = '数据加载中';
                syncIconEl.setAttribute('data-lucide', 'loader-2');
                syncIconEl.classList.add('animate-spin', 'text-white');
            } else if (state === 'syncing') {
                syncStatusEl.innerText = '保存中...';
                syncIconEl.setAttribute('data-lucide', 'loader-2');
                syncIconEl.classList.add('animate-spin', 'text-white');
            } else if (state === 'success') {
                syncStatusEl.innerText = '自动保存成功';
                syncIconEl.setAttribute('data-lucide', 'cloud');
                syncIconEl.classList.add('text-emerald-200');
            } else {
                syncStatusEl.innerText = '本地模式';
                syncIconEl.setAttribute('data-lucide', 'cloud-off');
                syncIconEl.classList.add('text-gray-300');
            }
            lucide.createIcons();
        }

        try {
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            }
        } catch (error) {
            console.error("Firebase init failed:", error);
        }

        if (auth) {
            updateSyncUI('loading');
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch(e) { console.error("Auth error", e); updateSyncUI('offline'); }
            };
            initAuth();

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'itinerary_data', 'expenses');
                    onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists() && docSnap.data().extras) {
                            dailyExtras = docSnap.data().extras;
                        }
                        renderItinerary();
                        calculateExpenses();
                        updateSyncUI('success');
                    }, (err) => {
                        console.error(err);
                        updateSyncUI('offline');
                    });
                }
            });
        } else {
            updateSyncUI('offline');
            const saved = localStorage.getItem('zjj_extras_v2');
            if(saved) dailyExtras = JSON.parse(saved);
            renderItinerary();
            calculateExpenses();
        }

        // --- Core Functions ---
        window.updateExtraData = async function(index, field, value) {
            dailyExtras[index][field] = value;
            calculateExpenses(); // Update UI immediately

            if (currentUser && db) {
                updateSyncUI('syncing');
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'itinerary_data', 'expenses');
                try {
                    await setDoc(docRef, { extras: dailyExtras }, { merge: true });
                    setTimeout(() => updateSyncUI('success'), 500);
                } catch (e) {
                    console.error("Save error", e);
                }
            } else {
                localStorage.setItem('zjj_extras_v2', JSON.stringify(dailyExtras));
            }
        }

        function renderItinerary() {
            const container = document.getElementById('content-itinerary');
            container.innerHTML = itineraryData.map((day, i) => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="bg-emerald-50 px-4 py-3 flex justify-between items-center border-b border-emerald-100">
                        <div class="flex items-center space-x-2">
                            <span class="bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded-md">${day.day}</span>
                            <span class="font-semibold text-emerald-900 text-sm">${day.date.substring(5)}</span>
                        </div>
                        <div class="flex items-center text-emerald-700 text-sm font-medium">
                            <i data-lucide="map-pin" class="w-4 h-4 mr-1"></i>${day.loc}
                        </div>
                    </div>

                    <div class="p-4 space-y-4">
                        ${day.trans ? `
                        <div class="flex items-start">
                            <div class="bg-blue-100 text-blue-600 p-2 rounded-lg mr-3 mt-1"><i data-lucide="${day.transType}" class="w-5 h-5"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 mb-1">交通安排</p>
                                <p class="text-sm font-medium text-gray-800">${day.trans}</p>
                                ${day.remark ? `<p class="text-xs text-red-500 mt-1 flex items-center bg-red-50 inline-block px-2 py-1 rounded"><i data-lucide="alert-circle" class="w-3 h-3 mr-1 inline"></i>${day.remark}</p>` : ''}
                            </div>
                        </div>` : ''}

                        ${day.itin ? `
                        <div class="flex items-start">
                            <div class="bg-orange-100 text-orange-600 p-2 rounded-lg mr-3 mt-1"><i data-lucide="camera" class="w-5 h-5"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 mb-1">今日游玩</p>
                                <p class="text-sm text-gray-700 leading-relaxed">${day.itin}</p>
                            </div>
                        </div>` : ''}

                        ${day.hotel ? `
                        <div class="flex items-start">
                            <div class="bg-purple-100 text-purple-600 p-2 rounded-lg mr-3 mt-1"><i data-lucide="bed-double" class="w-5 h-5"></i></div>
                            <div>
                                <p class="text-xs text-gray-500 mb-1">住宿酒店</p>
                                <p class="text-sm font-medium text-gray-800">${day.hotel}</p>
                            </div>
                        </div>` : ''}

                        <div class="mt-4 pt-4 border-t border-gray-100 flex space-x-4">
                            <div class="flex-1">
                                <label class="text-xs text-gray-500 flex items-center mb-1"><i data-lucide="utensils" class="w-3 h-3 mr-1 text-yellow-600"></i> 餐饮花费</label>
                                <input type="number" placeholder="0.00" value="${dailyExtras[i].food}" oninput="window.updateExtraData(${i}, 'food', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded-md px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                            </div>
                            <div class="flex-1">
                                <label class="text-xs text-gray-500 flex items-center mb-1"><i data-lucide="gift" class="w-3 h-3 mr-1 text-pink-600"></i> 纪念品/其他</label>
                                <input type="number" placeholder="0.00" value="${dailyExtras[i].souvenir}" oninput="window.updateExtraData(${i}, 'souvenir', this.value)" class="w-full bg-gray-50 border border-gray-200 rounded-md px-3 py-2 text-sm outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                            </div>
                        </div>
                    </div>
                </div>
            `).join('') + '<div class="text-center text-gray-400 text-sm py-4">-- 已经到底啦，祝旅途愉快！ --</div>';
            
            lucide.createIcons();
        }

        function calculateExpenses() {
            let t = 0, k = 0, h = 0, f = 0, s = 0;
            itineraryData.forEach((day, i) => {
                t += day.exp.t; k += day.exp.k; h += day.exp.h;
                f += parseFloat(dailyExtras[i].food || 0);
                s += parseFloat(dailyExtras[i].souvenir || 0);
            });
            const grandTotal = t + k + h + f + s;

            // Update UI Numbers
            document.getElementById('grand-total').innerText = grandTotal.toFixed(2);
            document.getElementById('chart-center-total').innerText = '¥' + grandTotal.toFixed(0);

            // Update Donut Chart Gradient
            const safeDiv = (val, tot) => tot > 0 ? (val/tot)*100 : 0;
            const p1 = safeDiv(t, grandTotal);
            const p2 = p1 + safeDiv(k, grandTotal);
            const p3 = p2 + safeDiv(h, grandTotal);
            const p4 = p3 + safeDiv(f, grandTotal);
            
            document.getElementById('main-chart').style.background = `conic-gradient(
                #60A5FA 0% ${p1}%, 
                #FB923C ${p1}% ${p2}%, 
                #C084FC ${p2}% ${p3}%, 
                #FACC15 ${p3}% ${p4}%, 
                #F472B6 ${p4}% 100%
            )`;

            // Render Breakdown List
            const breakdownData = [
                { icon: "plane", color: "blue", title: "交通费 (机票+高铁)", val: t, pct: p1 },
                { icon: "camera", color: "orange", title: "景区门票 / 包车", val: k, pct: p2-p1 },
                { icon: "bed-double", color: "purple", title: "酒店住宿", val: h, pct: p3-p2 },
                { icon: "utensils", color: "yellow", title: "餐饮美食", val: f, pct: p4-p3 },
                { icon: "gift", color: "pink", title: "纪念品/其他", val: s, pct: 100-p4 }
            ];

            document.getElementById('expense-breakdown').innerHTML = breakdownData.map(item => `
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="bg-${item.color}-100 p-2 rounded-lg text-${item.color}-600 mr-3">
                            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">${item.title}</p>
                            <p class="text-xs text-gray-500">${item.pct.toFixed(1)}%</p>
                        </div>
                    </div>
                    <span class="font-bold text-gray-800">${item.val.toFixed(2)}</span>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // --- UI Interactions ---
        window.switchTab = function(tab) {
            const itC = document.getElementById('content-itinerary');
            const exC = document.getElementById('content-expenses');
            const itB = document.getElementById('btn-itinerary');
            const exB = document.getElementById('btn-expenses');

            if (tab === 'itinerary') {
                itC.classList.remove('hidden'); exC.classList.add('hidden');
                itB.className = "tab-active flex-1 flex items-center justify-center py-2 rounded-full text-sm font-medium transition-all";
                exB.className = "flex-1 flex items-center justify-center py-2 rounded-full text-sm font-medium text-gray-500 hover:text-gray-700 transition-all";
            } else {
                itC.classList.add('hidden'); exC.classList.remove('hidden');
                itB.className = "flex-1 flex items-center justify-center py-2 rounded-full text-sm font-medium text-gray-500 hover:text-gray-700 transition-all";
                exB.className = "tab-active flex-1 flex items-center justify-center py-2 rounded-full text-sm font-medium transition-all";
                calculateExpenses();
            }
        }
        
        // Initial setup for icons
        lucide.createIcons();
    </script>
</body>
</html>
